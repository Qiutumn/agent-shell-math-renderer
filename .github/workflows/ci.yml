# Byte-compilation, checkdoc and the ERT suite, on every push to main or
# develop and every pull request.
#
# The package `require's agent-shell, so loading it -- and thus the tests --
# pulls the whole agent-shell stack (agent-shell itself plus shell-maker and
# acp) and latex-to-svg-backend.  package.el installs agent-shell from
# MELPA and the MathJax backend from the companion fork.  Later steps call
# `package-initialize' to put them on the load-path.
#
# The suite needs no TeX toolchain, no graphical display and no Emacs built
# with librsvg: nothing in it skips.
#
# The matrix is the declared floor (29.1, the `Package-Requires' of
# agent-shell-math-renderer.el), then the newest of each series, then master.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.1', '29.4', '30.2', '31.1', 'snapshot']
    name: Emacs ${{ matrix.emacs_version }}
    # A snapshot Emacs breaks for reasons that are not this package's;
    # it is here as early warning, not as a gate.
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Report version
        run: emacs --version | head -1

      # MathJax is provided by the companion fork, not upstream MELPA.
      - uses: actions/checkout@v4
        with:
          repository: Qiutumn/latex-to-svg-backend
          ref: main
          path: .ci/latex-to-svg-backend

      - name: Install agent-shell and the companion backend
        run: |
          for attempt in 1 2 3; do
            if emacs -Q -batch --eval '(progn
              (require (quote package))
              (add-to-list (quote package-archives)
                           (cons "melpa" "https://melpa.org/packages/") t)
              (package-initialize)
              (package-refresh-contents)
              (package-install (quote agent-shell))
              (package-install-file
               (file-name-as-directory (expand-file-name ".ci/latex-to-svg-backend"))))'; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      # The test file is compiled too: a macro used before its definition
      # compiles as a function call, which loading the source does not catch.
      - name: Byte-compile, warnings as errors
        run: |
          emacs -Q -batch \
            --eval '(progn (require (quote package)) (package-initialize))' \
            --eval '(setq byte-compile-error-on-warn t)' \
            -L . -f batch-byte-compile agent-shell-math-renderer.el \
            tests/agent-shell-math-renderer-tests.el

      # Docstring conventions, exiting non-zero on any finding.  Both flags
      # are set rather than left at their defaults, so the step reports the
      # same thing on every Emacs: the experimental verb check defaults to t
      # up to Emacs 30 and nil from 31.
      - name: Checkdoc
        run: |
          emacs -Q -batch --eval '(progn
            (require (quote checkdoc))
            (setq checkdoc-force-docstrings-flag nil)
            (setq checkdoc-verb-check-experimental-flag nil)
            (checkdoc-file "agent-shell-math-renderer.el")
            (if (get-buffer "*Warnings*")
                (kill-emacs 1)
              (message "checkdoc: clean")))'

      - name: ERT
        run: |
          emacs -Q -batch \
            --eval '(progn (require (quote package)) (package-initialize))' \
            -L . -l ert -l tests/agent-shell-math-renderer-tests.el \
            -f ert-run-tests-batch-and-exit

  # `agent-shell-math-renderer--text-foreground' follows two functions of
  # Emacs's faces.el; tests/fixtures/emacs-faces-attribute-at-point.el holds
  # a copy of them.  On Emacs snapshot, where they would change first, this
  # compares them with the copy and prints a diff when they differ.  A
  # change in Emacs is no failure of this package, so the job may fail.
  emacs-faces:
    runs-on: ubuntu-latest
    name: Emacs faces.el vs. our copy
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: snapshot

      - name: Compare faces--attribute-at-point and foreground-color-at-point
        run: emacs -Q -batch -l scripts/emacs-faces-check.el

  # Before a release: when the version in the header has no tag yet, this
  # commit is (or leads up to) a release, so run the checks that need
  # MELPA Stable (scripts/release-check.el): the renderer must require the
  # newest backend there, MELPA Stable must have the agent-shell it requires,
  # and CHANGELOG.md must have the version's dated section.  After the tag exists, ordinary pushes skip it.  One Emacs is
  # enough; the result does not depend on the Emacs version.  Develop
  # skips it: it may require a backend that MELPA Stable does not have yet.
  release-check:
    if: github.repository == 'alberti42/agent-shell-math-renderer' && github.ref_name != 'develop' && github.head_ref != 'develop'
    runs-on: ubuntu-latest
    name: Release check
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: '30.2'

      - name: Check a version not yet tagged
        run: |
          version=$(sed -n 's/^;; Version: //p' agent-shell-math-renderer.el)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to check before a release."
          else
            echo "v$version is not tagged yet; checking it as a release."
            emacs -Q -batch -l scripts/release-check.el
          fi
